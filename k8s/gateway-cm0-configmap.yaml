apiVersion: v1
data:
  app.js: |
    const express = require('express');
    const betRoute = require('./routes/bet.route');
    const userRoute = require('./routes/user.route');
    const { client } = require('./metrics');

    const app = express();

    // collect metrics
    app.get('/metrics', async (req, res) => {
        res.set('Content-Type', client.register.contentType);
        res.end(await client.register.metrics());
    });

    const cors = require('cors');
    const { httpRequestsTotal } = require('./metrics');

    app.use(cors({
        origin: true, // Allow any origin
        credentials: true
    }));
    app.use(express.json({ limit: '1mb' }));

    app.use((req, res, next) => {
        res.on('finish', () => {
            httpRequestsTotal.inc({
                method: req.method,
                route: req.route?.path || req.path,
                status: res.statusCode
            });
        });
        next();
    });

    app.get('/health', (req, res) => res.status(200).json({ status: 'ok' }));


    app.use('/api', betRoute);
    app.use('/api/user', userRoute);

    module.exports = app;
  metrics.js: |-
    // src/metrics.js
    const client = require('prom-client');

    // Collect default Node.js metrics (CPU, memory, GC, event loop, etc.)
    client.collectDefaultMetrics();

    // Custom counters (customize per service)
    const httpRequestsTotal = new client.Counter({
        name: 'http_requests_total',
        help: 'Total HTTP requests',
        labelNames: ['method', 'route', 'status']
    });

    const kafkaMessagesProcessed = new client.Counter({
        name: 'kafka_messages_processed_total',
        help: 'Total Kafka messages processed',
        labelNames: ['topic', 'status']
    });

    const betsPlaced = new client.Counter({
        name: 'bets_placed_total',
        help: 'Total bets placed',
    });

    const winsProcessed = new client.Counter({
        name: 'wins_processed_total',
        help: 'Total wins processed',
    });

    module.exports = {
        client,
        httpRequestsTotal,
        kafkaMessagesProcessed,
        betsPlaced,
        winsProcessed,
        // Add more as needed
    };
  server.js: "require('dotenv').config();\nconst http = require('http');\nconst app = require('./app');\nconst { init } = require('./services/event.publisher');\nconst { initWebSocket } = require('./ws/socket.handler');\n\nconst PORT = process.env.PORT || 3000;\n\nconst server = http.createServer(app);\n\n// Initialize WebSocket\ninitWebSocket(server);\n\n// Initialize Kafka producer\ninit().then(() => {\n    const instance = server.listen(PORT, () => {\n        console.log(`Gateway service running on port ${PORT}`);\n        console.log(`WebSocket server ready`);\n    });\n\n    // Graceful Shutdown\n    const shutdown = async (signal) => {\n        console.log(`\\n${signal} received. Shutting down gracefully...`);\n        instance.close(async () => {\n            console.log('HTTP server closed');\n            try {\n                const { getProducer } = require('./services/event.publisher');\n                const producer = getProducer();\n                if (producer) await producer.disconnect();\n                console.log('Kafka producer disconnected');\n\n                // Close Redis clients used in services\n                const { redis } = require('./services/bet.service'); // if exported, or just require and quit\n                // Actually bet.service might have its own redis instance\n                // But ws/socket.handler also has. \n                // Let's just create a shared one later if needed, but for now:\n                const Redis = require('ioredis');\n                const globalRedis = new Redis(process.env.REDIS_URL || 'redis://redis:6379');\n                await globalRedis.quit();\n\n                process.exit(0);\n            } catch (err) {\n                console.error('Error during shutdown:', err);\n                process.exit(1);\n            }\n        });\n    };\n\n    process.on('SIGINT', () => shutdown('SIGINT'));\n    process.on('SIGTERM', () => shutdown('SIGTERM'));\n\n}).catch(err => {\n    console.error('Failed to start gateway service', err);\n    process.exit(1);\n});\n"
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: gateway
  name: gateway-cm0
