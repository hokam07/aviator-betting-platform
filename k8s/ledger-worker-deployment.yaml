apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: ledger-worker
  name: ledger-worker
spec:
  replicas: 6
  selector:
    matchLabels:
      io.kompose.service: ledger-worker
  template:
    metadata:
      labels:
        io.kompose.service: ledger-worker
    spec:
      containers:
        - env:
            - name: CASSANDRA_HOSTS
              value: cassandra
            - name: CASSANDRA_KEYSPACE
              value: aviator
            - name: KAFKA_BROKERS
              value: kafka:9093
            - name: REDIS_URL
              value: redis://redis:6379
            - name: KAFKA_MAX_BYTES_PER_PARTITION
              value: "1048576"  # 1MB per partition for better throughput
          image: ledger-worker
          imagePullPolicy: IfNotPresent
          name: ledger-worker
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - pgrep
                - node
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
