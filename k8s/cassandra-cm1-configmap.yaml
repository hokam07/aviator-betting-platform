apiVersion: v1
data:
  schema.cql: "CREATE KEYSPACE IF NOT EXISTS aviator\nWITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}\nAND durable_writes = true;\n\nUSE aviator;\n\n// Users table: Core user data, balances (no STATIC since no clustering)\nCREATE TABLE users (\n    user_id uuid PRIMARY KEY,\n    balance decimal,\n    pending_debits decimal,\n    version int,\n    max_bet_amount decimal,\n    daily_bet_limit decimal,\n    fraud_risk_level text,\n    last_activity timestamp,\n    created_at timestamp\n);\n\n// Ledger transactions: Immutable append-only audit trail\nCREATE TABLE ledger_transactions (\n    user_id uuid,\n    date_bucket text,                     // e.g., '2025-12'\n    tx_id timeuuid,\n    amount decimal,\n    direction text,                       // 'DEBIT', 'CREDIT'\n    status text,                          // 'PENDING', 'CONFIRMED', 'FAILED'\n    bet_round_id uuid,\n    external_tx_id text,\n    event_type text,                      // 'bet', 'win', 'loss', 'rollback'\n    provider text,\n    ip_address text,\n    device_id text,\n    notes text,\n    created_at timestamp,\n    PRIMARY KEY ((user_id, date_bucket), tx_id)\n) WITH CLUSTERING ORDER BY (tx_id DESC)\nAND compaction = {'class': 'TimeWindowCompactionStrategy'};\n\n// Idempotency guard\nCREATE TABLE callback_idempotency (\n    provider text,\n    external_tx_id text,\n    processed_at timestamp,\n    payload_hash text,\n    user_id uuid,\n    bet_round_id uuid,\n    PRIMARY KEY (provider, external_tx_id)\n);\n\nCREATE INDEX idx_idempotency_user ON callback_idempotency (user_id);\n\n// Pending bets\nCREATE TABLE pending_bets (\n    user_id uuid,\n    bet_round_id uuid,\n    amount decimal,\n    placed_at timestamp,\n    external_tx_id text,\n    status text,\n    aggregator_response text,\n    PRIMARY KEY (user_id, bet_round_id)\n) WITH default_time_to_live = 3600;\n\n// Game rounds (optional)\nCREATE TABLE game_rounds (\n    round_id uuid PRIMARY KEY,\n    start_time timestamp,\n    end_time timestamp,\n    crash_point decimal,\n    multiplier decimal,\n    status text\n);\n\n// Fraud logs\nCREATE TABLE fraud_logs (\n    user_id uuid,\n    event_time timeuuid,\n    event_type text,\n    details text,\n    severity text,\n    PRIMARY KEY (user_id, event_time)\n) WITH CLUSTERING ORDER BY (event_time DESC);\n\n// Analytics counters\nCREATE TABLE analytics_counters (\n    metric_date text,\n    metric_type text,\n    counter counter,\n    PRIMARY KEY (metric_date, metric_type)\n);\n\n// User-specific lifetime stats (Scalable counters)\nCREATE TABLE user_stats (\n    user_id uuid PRIMARY KEY,\n    total_bet_count counter,\n    total_win_count counter,\n    total_loss_count counter,\n    total_wagered_amount_cents counter, \n    total_won_amount_cents counter\n);\n\n// Chat keyspace (decoupled)\nCREATE KEYSPACE IF NOT EXISTS chat\nWITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};\n\nUSE chat;\n\nCREATE TABLE messages (\n    room_id uuid,\n    msg_id timeuuid,\n    user_id uuid,\n    content text,\n    sent_at timestamp,\n    PRIMARY KEY (room_id, msg_id)\n) WITH CLUSTERING ORDER BY (msg_id DESC)\nAND default_time_to_live = 86400;"
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: cassandra
  name: cassandra-cm1
