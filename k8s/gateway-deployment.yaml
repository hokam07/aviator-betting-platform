apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: gateway
  name: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      io.kompose.service: gateway
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: gateway
    spec:
      containers:
        - env:
            - name: AGGREGATOR_API_KEY
              value: test-key
            - name: AGGREGATOR_URL
              value: https://aggregator.example.com/api
            - name: KAFKA_BROKERS
              value: kafka:9093
            - name: REDIS_URL
              value: redis://redis:6379
          image: gateway
          name: gateway
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/src/app/src
              name: gateway-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: gateway-cm0
          name: gateway-cm0
