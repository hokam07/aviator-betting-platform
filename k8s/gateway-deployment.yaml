apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: gateway
  name: gateway
spec:
  replicas: 5
  selector:
    matchLabels:
      io.kompose.service: gateway
  template:
    metadata:
      labels:
        io.kompose.service: gateway
    spec:
      containers:
        - env:
            - name: AGGREGATOR_API_KEY
              value: test-key
            - name: AGGREGATOR_URL
              value: https://aggregator.example.com/api
            - name: KAFKA_BROKERS
              value: kafka:9093
            - name: REDIS_URL
              value: redis://redis:6379
            - name: NODE_OPTIONS
              value: "--max-old-space-size=4096"  # 4GB heap for WebSocket scaling
          image: gateway
          imagePullPolicy: IfNotPresent
          name: gateway
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 4096Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - mountPath: /usr/src/app/src
              name: gateway-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: gateway-cm0
          name: gateway-cm0
