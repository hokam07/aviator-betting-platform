version: "3.8"

services:
  cassandra:
    image: cassandra:5.0 
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./ledger-worker/db/schema.cql:/docker-entrypoint-initdb.d/schema.cql 
    environment:
      - HEAP_NEWSIZE=1G
      - MAX_HEAP_SIZE=4G
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ]"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:29093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,EXTERNAL://localhost:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  ledger-worker:
    build: ./ledger-worker
    container_name: ledger-worker
    volumes:
    - ./ledger-worker/src:/usr/src/app/src
    - ./ledger-worker/package.json:/usr/src/app/package.json
    - ./ledger-worker/package-lock.json:/usr/src/app/package-lock.json
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_KEYSPACE=aviator
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9093
    restart: unless-stopped

  callback:
    build: ./callback
    container_name: callback
    ports:
      - "3001:3000"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9093
      - HMAC_SECRET=${HMAC_SECRET:-super-secret-change-in-prod}
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "3000:3000"
    volumes:
    - ./gateway/src:/usr/src/app/src
    - ./gateway/package.json:/usr/src/app/package.json
    - ./gateway/package-lock.json:/usr/src/app/package-lock.json
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_BROKERS=kafka:9093
      - REDIS_URL=redis://redis:6379
      - AGGREGATOR_URL=${AGGREGATOR_URL:-https://aggregator.example.com/api}
      - AGGREGATOR_API_KEY=${AGGREGATOR_API_KEY:-test-key}
    restart: unless-stopped

  bet-resolver:
    build: ./bet-resolver
    container_name: bet-resolver
    volumes:
      - ./bet-resolver:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - kafka
      - callback
    environment:
      - KAFKA_BROKERS=kafka:9093
      - CALLBACK_URL=http://callback:3000/callback
    restart: unless-stopped

volumes:
  cassandra-data:
