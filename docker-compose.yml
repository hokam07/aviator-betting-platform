version: "3.8"

services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./ledger-worker/db/schema.cql:/docker-entrypoint-initdb.d/schema.cql
    environment:
      - HEAP_NEWSIZE=1G
      - MAX_HEAP_SIZE=4G
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ]"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9094:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  ledger-worker:
    build: ./ledger-worker
    volumes:
      - ./ledger-worker/src:/usr/src/app/src
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_KEYSPACE=aviator
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9093
    restart: unless-stopped

  callback:
    build: ./callback
    ports:
      - "3001:3000"  # Only one instance needed for callback
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9093
      - HMAC_SECRET=${HMAC_SECRET:-super-secret-change-in-prod}
    restart: unless-stopped

  gateway:
    build: ./gateway
    volumes:
      - ./gateway/src:/usr/src/app/src
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_BROKERS=kafka:9093
      - REDIS_URL=redis://redis:6379
      - AGGREGATOR_URL=${AGGREGATOR_URL:-https://aggregator.example.com/api}
      - AGGREGATOR_API_KEY=${AGGREGATOR_API_KEY:-test-key}
    restart: unless-stopped

  bet-resolver:
    build: ./bet-resolver
    volumes:
      - ./bet-resolver:/usr/src/app
    depends_on:
      - kafka
      - callback
    environment:
      - KAFKA_BROKERS=kafka:9093
      - CALLBACK_URL=http://callback:3000/callback
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  gateway-proxy:
    image: nginx:alpine
    container_name: gateway-proxy
    ports:
      - "3000:80"                  # This exposes localhost:3000
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  cassandra-data: